<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphic.Bishr — Creative Designer & Thinker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--blue:#0c3ee8;--blue-deep:#081e8a;--blue-grid:rgba(255,255,255,.07);
--lime:#d6ff3d;--lime-2:#e2ff6a;--ink:#080a18;--cream:#f1eee7;--white:#fff;
--muted:#6a7188;--muted-2:#9aa1b5;--line:rgba(8,10,24,.11);--line-l:rgba(255,255,255,.14);
--r-xl:32px;--r-lg:22px;--r-md:16px;--ease:cubic-bezier(.22,1,.36,1)
}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--ink);color:#fff;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body[data-theme="light"]{background:var(--cream);color:var(--ink)}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
::selection{background:var(--lime);color:#000}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#252a45;border-radius:99px;border:2px solid #0d1024}
.display{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-.05em;line-height:.86}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.02em}
.mono{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.wrap{width:min(1280px,100% - 32px);margin-inline:auto}
.section{padding:96px 0}
.grain{position:fixed;inset:-100px;pointer-events:none;z-index:9000;opacity:.22;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.6'/></svg>")}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--lime),var(--blue));z-index:9200;width:0}
/* NAV */
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(1280px,100% - 20px);z-index:800;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px 8px 14px;border-radius:999px;background:rgba(8,10,24,.56);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.13);transition:.35s}
.nav.scrolled{box-shadow:0 16px 50px rgba(0,0,0,.35)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--lime);color:#000;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:.9rem;flex:none}
.brand-name{font-family:'Bricolage Grotesque';font-weight:800;font-size:.9rem;letter-spacing:-.02em;text-transform:uppercase;color:#fff;line-height:1}
.brand-sub{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700}
.nav-links{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.07);padding:4px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}
.nav-links a{color:rgba(255,255,255,.72);font-size:.8rem;font-weight:700;padding:8px 16px;border-radius:999px;transition:.2s;white-space:nowrap}
.nav-links a:hover{color:#fff;background:rgba(255,255,255,.09)}
.nav-links a.active{background:#fff;color:var(--ink)}
.nav-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);color:#fff;transition:.22s;flex:none}
.icon-btn:hover{background:var(--lime);color:#000;border-color:var(--lime);transform:rotate(-8deg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:13px 24px;border-radius:999px;font-weight:800;font-size:.88rem;transition:.3s var(--ease);white-space:nowrap;border:1.5px solid transparent;letter-spacing:-.01em}
.btn i{font-size:.8rem;transition:.3s}
.btn:hover{transform:translateY(-2px)}.btn:hover i{transform:translateX(3px)}
.btn-lime{background:var(--lime);color:#000;box-shadow:0 10px 30px rgba(214,255,61,.28)}
.btn-dark{background:var(--ink);color:#fff}.btn-blue{background:var(--blue);color:#fff}
.btn-ghost-d{border-color:rgba(255,255,255,.32);color:#fff}.btn-ghost-d:hover{background:#fff;color:#000;border-color:#fff}
.btn-sm{padding:9px 18px;font-size:.78rem}
.burger{display:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);flex-direction:column;gap:5px;align-items:center;justify-content:center}
.burger span{width:16px;height:1.8px;background:#fff;border-radius:2px;transition:.3s}
body.menu-open .burger span:nth-child(1){transform:translateY(3.4px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){transform:translateY(-3.4px) rotate(-45deg)}
.mobile-menu{position:fixed;inset:0;z-index:790;background:#050a2e;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:40px;clip-path:circle(0% at calc(100% - 52px) 44px);transition:clip-path .6s var(--ease);pointer-events:none}
body.menu-open .mobile-menu{clip-path:circle(150% at calc(100% - 52px) 44px);pointer-events:auto}
.mobile-menu a{font-family:'Bricolage Grotesque';font-weight:800;text-transform:uppercase;font-size:clamp(2rem,9vw,3.2rem);letter-spacing:-.04em;color:#fff;display:flex;gap:14px;opacity:0;transform:translateY(20px);transition:.4s var(--ease)}
.mobile-menu a span{font-family:'JetBrains Mono';font-size:.6rem;color:var(--lime)}
body.menu-open .mobile-menu a{opacity:1;transform:none}
body.menu-open .mobile-menu a:nth-child(1){transition-delay:.1s}body.menu-open .mobile-menu a:nth-child(2){transition-delay:.18s}body.menu-open .mobile-menu a:nth-child(3){transition-delay:.26s}body.menu-open .mobile-menu a:nth-child(4){transition-delay:.34s}body.menu-open .mobile-menu a:nth-child(5){transition-delay:.42s}body.menu-open .mobile-menu a:nth-child(6){transition-delay:.5s}
/* HERO - REFERENCE IMAGE STYLE */
.hero{position:relative;min-height:96svh;display:flex;flex-direction:column;justify-content:center;padding:132px 0 90px;background:var(--blue);overflow:hidden;isolation:isolate}
.hero-grid{position:absolute;inset:0;z-index:-2;background-image:linear-gradient(var(--blue-grid) 1px,transparent 1px),linear-gradient(90deg,var(--blue-grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 85% 70% at 50% 38%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 85% 70% at 50% 38%,#000 30%,transparent 80%)}
.hero-glow{position:absolute;width:1100px;height:1100px;left:50%;top:-30%;transform:translateX(-50%);background:radial-gradient(circle,rgba(214,255,61,.18) 0%,rgba(12,62,232,.55) 42%,transparent 68%);filter:blur(20px);z-index:-3}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.tag-pill{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff;backdrop-filter:blur(10px)}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(214,255,61,.7);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(214,255,61,0)}100%{box-shadow:0 0 0 0 rgba(214,255,61,0)}}
.hero-title{font-size:clamp(3rem,10.8vw,8.8rem);color:#fff;display:flex;flex-direction:column;position:relative;z-index:2}
.hero-title .line{overflow:hidden;display:block}
.hero-title .w{display:inline-block}
.hero-title .hash{color:var(--lime);margin-right:.06em}
.scribble{position:absolute;z-index:3;pointer-events:none;color:var(--lime)}
.scribble-1{right:18%;top:18%;width:160px;transform:rotate(12deg)}
.scribble-2{left:48%;bottom:8%;width:140px;transform:rotate(-18deg)}
.float-card{position:absolute;pointer-events:auto;width:210px;padding:18px;border-radius:22px;background:rgba(255,255,255,.11);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);box-shadow:0 22px 50px rgba(0,0,0,.32);transition:.45s var(--ease);cursor:pointer;z-index:5}
.float-card:hover{transform:translateY(-8px) scale(1.03);background:rgba(255,255,255,.18);border-color:var(--lime)}
.fc-1{right:4%;top:22%;animation:floaty 6s ease-in-out infinite alternate}
.fc-2{right:14%;bottom:18%;animation:floaty 7s ease-in-out infinite alternate-reverse}
@keyframes floaty{to{transform:translateY(-14px) rotate(1.2deg)}}
.fc-avatar{width:54px;height:54px;border-radius:50%;padding:2px;background:linear-gradient(140deg,var(--lime),#fff);margin-bottom:10px}
.fc-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.fc-title{font-family:'Bricolage Grotesque';font-weight:800;font-size:.95rem;color:#fff;letter-spacing:-.02em}
.fc-sub{font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700;margin-top:2px}
.fc-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin-top:12px;overflow:hidden}
.fc-bar i{display:block;height:100%;background:var(--lime);width:78%;border-radius:99px}
.spin-badge{position:absolute;right:5%;bottom:28%;width:122px;height:122px;z-index:6;animation:spin 14s linear infinite;cursor:pointer;filter:drop-shadow(0 12px 26px rgba(0,0,0,.3))}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:end;margin-top:42px;padding-top:28px;border-top:1px solid rgba(255,255,255,.16);position:relative;z-index:2}
.hero-lede{font-size:clamp(1rem,1.25vw,1.15rem);color:rgba(255,255,255,.78);max-width:500px;line-height:1.65}
.hero-lede strong{color:#fff}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
/* LIME CTA STRIP - FROM IMAGE */
.lime-strip{position:relative;z-index:20;margin-top:-46px;padding:0 16px}
.lime-strip-inner{width:min(1280px,100% - 0px);margin-inline:auto;background:var(--lime);border-radius:28px;padding:28px 28px 28px 42px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;box-shadow:0 20px 60px rgba(0,0,0,.22);transform:rotate(-.4deg)}
.lime-strip h2{font-family:'Bricolage Grotesque';font-weight:800;text-transform:uppercase;font-size:clamp(1.4rem,3.2vw,2.8rem);line-height:.9;letter-spacing:-.04em;color:#000;max-width:720px}
.lime-strip .serif{font-weight:400}
.lime-btn{background:#000;color:#fff;padding:14px 22px;border-radius:999px;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:10px;transition:.3s}
.lime-btn:hover{transform:translateY(-2px) rotate(-1deg);background:#111}
/* TOOLS MARQUEE - SLIDING SOFTWARE ICONS */
.tools-marquee{background:#080a18;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08);overflow:hidden;padding:16px 0;position:relative}
body[data-theme="light"] .tools-marquee{background:var(--ink);border-color:rgba(255,255,255,.1)}
.tools-track{display:flex;animation:scrollX 32s linear infinite;will-change:transform}
.tools-track:hover{animation-play-state:paused}
.tool-item{display:flex;align-items:center;gap:12px;padding:0 34px;white-space:nowrap;color:#fff;font-weight:800;font-size:.95rem;letter-spacing:-.01em;border-right:1px solid rgba(255,255,255,.08)}
.tool-item i{font-size:1.35rem;color:var(--lime)}
.tool-item .t-sub{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:700;margin-left:2px}
@keyframes scrollX{to{transform:translateX(-50%)}}
.marquee{display:flex;overflow:hidden;border-top:1px solid var(--line-l);border-bottom:1px solid var(--line-l);padding:18px 0;background:var(--ink);gap:0}
body[data-theme="light"] .marquee{background:var(--ink);border-color:var(--line)}
.marquee-inner{display:flex;flex:none;animation:scrollX 30s linear infinite;white-space:nowrap}
.marquee-item{display:inline-flex;align-items:center;gap:28px;padding-right:28px;font-family:'Bricolage Grotesque';font-weight:800;text-transform:uppercase;font-size:clamp(1rem,2vw,1.7rem);letter-spacing:-.03em;color:#fff}
.marquee-item .star{color:var(--lime);font-size:.8em}
.marquee-item .out{color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.5)}
/* SECTIONS */
.page-head{padding:148px 0 44px}
.crumb{color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:18px}
.crumb i{color:var(--blue);font-size:.6rem}
.page-title{font-size:clamp(2.8rem,8vw,6.8rem);line-height:.88;letter-spacing:-.05em;color:var(--ink)}
.page-lede{font-size:1.02rem;color:var(--muted);max-width:620px;margin-top:18px;line-height:1.7}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:42px}
.sec-title{font-size:clamp(2rem,5vw,4rem);line-height:.9;letter-spacing:-.045em;text-transform:uppercase;font-family:'Bricolage Grotesque';font-weight:800}
/* WORK GRID */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:38px}
.filter-btn{padding:10px 18px;border-radius:999px;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);color:var(--muted);background:transparent;transition:.25s}
.filter-btn:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-2px)}
.filter-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}
.grid-projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:26px}
.p-card{display:flex;flex-direction:column;background:#fff;border-radius:22px;overflow:hidden;border:1px solid rgba(8,10,24,.07);box-shadow:0 8px 24px rgba(8,10,24,.04);transition:.5s var(--ease)}
.p-card:hover{transform:translateY(-8px);box-shadow:0 26px 50px rgba(12,62,232,.16);border-color:rgba(12,62,232,.22)}
.p-thumb{position:relative;height:250px;overflow:hidden;background:#e3e6ef}
.p-thumb img{width:100%;height:100%;object-fit:cover;transition:.8s var(--ease)}
.p-card:hover .p-thumb img{transform:scale(1.06)}
.p-cat{position:absolute;top:14px;left:14px;z-index:2;background:rgba(8,10,24,.72);backdrop-filter:blur(10px);color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.16)}
.p-feat{position:absolute;top:14px;right:14px;z-index:2;background:var(--lime);color:#000;font-size:.6rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;border-radius:999px;display:flex;align-items:center;gap:5px}
.p-body{padding:22px 20px 18px;display:flex;flex-direction:column;flex-grow:1}
.p-meta{display:flex;gap:10px;color:var(--muted-2);margin-bottom:10px}
.p-title{font-family:'Bricolage Grotesque';font-weight:800;font-size:1.35rem;letter-spacing:-.03em;line-height:1.1;color:var(--ink);margin-bottom:8px}
.p-desc{font-size:.86rem;color:var(--muted);line-height:1.6;margin-bottom:18px;flex-grow:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid rgba(8,10,24,.06)}
.p-tools{display:flex;gap:5px;flex-wrap:wrap}
.tool-pill{background:#f2f4f9;color:#4c5470;font-size:.64rem;font-weight:700;padding:4px 10px;border-radius:999px}
.p-arrow{width:36px;height:36px;border-radius:50%;background:#eef2fe;color:var(--blue);display:grid;place-items:center;font-size:.78rem;transition:.35s;flex:none}
.p-card:hover .p-arrow{background:var(--blue);color:#fff;transform:rotate(45deg)}
.empty-state{grid-column:1/-1;text-align:center;padding:70px 20px;background:#fff;border-radius:22px;border:1px dashed rgba(8,10,24,.16)}
/* DETAIL */
.detail{padding-bottom:40px}
.detail-nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:148px 0 26px;flex-wrap:wrap}
.back-link{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.82rem;color:var(--muted);padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);transition:.25s}
.back-link:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.detail-hero{border-radius:28px;overflow:hidden;height:clamp(300px,48vw,580px);box-shadow:0 30px 70px rgba(8,10,24,.18);background:#0e1226}
.detail-hero img{width:100%;height:100%;object-fit:cover}
.detail-head{padding:44px 0 0}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.chip-lime{background:var(--lime);color:#000}.chip-blue{background:var(--blue);color:#fff}.chip-outline{border:1px solid var(--line);color:var(--muted)}
.detail-title{font-family:'Bricolage Grotesque';font-weight:800;text-transform:uppercase;font-size:clamp(2rem,5.5vw,4.2rem);line-height:.92;letter-spacing:-.045em;color:var(--ink);margin-bottom:20px}
.detail-lede{font-size:clamp(1rem,1.4vw,1.18rem);color:#3d445c;line-height:1.7;max-width:820px}
.detail-specs{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:16px;overflow:hidden;margin:44px 0 18px;border:1px solid var(--line)}
.spec{background:var(--cream);padding:20px 18px}
.spec .k{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:6px;font-family:'JetBrains Mono'}
.spec .v{font-weight:700;font-size:.92rem;color:var(--ink);line-height:1.4}
.detail-block{padding:22px 0 6px}
.detail-block h3{font-family:'Bricolage Grotesque';font-size:1.15rem;text-transform:uppercase;letter-spacing:-.02em;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.detail-block h3::before{content:'';width:20px;height:2px;background:var(--lime);display:inline-block}
.detail-block p{color:#454c63;line-height:1.8;font-size:.98rem;max-width:820px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:20px}
.g-img{border-radius:16px;overflow:hidden;background:#e6e8f0;box-shadow:0 12px 30px rgba(8,10,24,.06)}
.g-img img{width:100%;height:100%;object-fit:cover;transition:.7s}
.g-img:hover img{transform:scale(1.04)}
.g-img.wide{grid-column:1/-1}
.next-project{margin-top:70px;padding:38px;border-radius:28px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;transition:.4s;position:relative;overflow:hidden}
.next-project:hover{transform:translateY(-5px);background:var(--blue)}
.next-project .np-k{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:800;margin-bottom:6px;font-family:'JetBrains Mono'}
.next-project .np-t{font-family:'Bricolage Grotesque';font-size:clamp(1.4rem,3vw,2.4rem);text-transform:uppercase;letter-spacing:-.03em;line-height:1}
/* ABOUT, CV, CONTACT */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.about-photo{background:#fff;border-radius:28px;padding:16px;box-shadow:0 24px 60px rgba(8,10,24,.08);position:sticky;top:110px}
.about-photo-inner{border-radius:18px;overflow:hidden;height:520px;position:relative;background:var(--blue-deep)}
.about-photo-inner img{width:100%;height:100%;object-fit:cover}
.about-photo-tag{position:absolute;left:14px;right:14px;bottom:14px;padding:14px 16px;border-radius:16px;background:rgba(9,12,32,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bio-lead{font-size:clamp(1.1rem,1.9vw,1.5rem);line-height:1.5;color:var(--ink);font-weight:500;letter-spacing:-.015em}
.bio-p{color:var(--muted);line-height:1.8;font-size:.98rem;margin-top:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:#fff;border:1px solid rgba(8,10,24,.1);color:#171b31;padding:8px 15px;border-radius:999px;font-weight:700;font-size:.8rem;transition:.25s;box-shadow:0 2px 6px rgba(8,10,24,.03)}

function parseRoute(){const raw=(location.hash||'#/').replace(/^#/,'');return raw.split('/').filter(Boolean)}
function setActiveNav(k){document.querySelectorAll('#navLinks a').forEach(a=>a.classList.toggle('active',a.dataset.nav===k))}
function render(){
const segs=parseRoute();const root=document.getElementById('appRoot');
if(segs[0]==='admin'){renderAdminRoute();return}
document.body.dataset.page='';let html='',theme='light',navKey='home',title='Home';
if(segs.length===0){html=pageHome();theme='dark';navKey='home';title='Home'}
else if(segs[0]==='work'){if(segs[1]){const p=getProjectsSorted().find(x=>x.id===segs[1]);if(p){html=pageDetail(p);theme='light';navKey='work';title=p.title}else{html=page404();theme='light';navKey='work';title='Not found'}}else{html=pageWork();theme='light';navKey='work';title='Work'}}
else if(segs[0]==='about'){html=pageAbout();theme='light';navKey='about';title='About'}
else if(segs[0]==='cv'){html=pageCV();theme='light';navKey='cv';title='CV'}
else if(segs[0]==='contact'){html=pageContact();theme='light';navKey='contact';title='Contact'}
else{html=page404();theme='light';navKey='';title='Not found'}
document.title=`${title} — ${getSite().name}`;document.body.dataset.theme=theme;document.body.classList.remove('menu-open');root.innerHTML=html;setActiveNav(navKey);window.scrollTo({top:0,behavior:'auto'});observeReveals();animateMeters();bindPageForms();
}
function observeReveals(){if(revealObs)revealObs.disconnect();const els=document.querySelectorAll('.reveal');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}revealObs=new IntersectionObserver((entries)=>{entries.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');revealObs.unobserve(en.target)}})},{threshold:.1,rootMargin:'0px 0px -60px 0px'});els.forEach(e=>revealObs.observe(e))}
function animateMeters(){const fills=document.querySelectorAll('.sm-fill');if(!fills.length)return;setTimeout(()=>{fills.forEach(f=>f.style.width=f.dataset.w+'%')},240)}
function bindPageForms(){
const cf=document.getElementById('contactForm');
if(cf){cf.addEventListener('submit',(e)=>{e.preventDefault();const inbox=getInbox();inbox.unshift({id:'msg-'+Date.now(),date:new Date().toLocaleString(),name:document.getElementById('cf_name').value,email:document.getElementById('cf_email').value,scope:document.getElementById('cf_scope').value,message:document.getElementById('cf_message').value});write(K.inbox,inbox);showToast('Message sent — check admin inbox');cf.reset();});}
}
function downloadCV(){
const cv=getCV();if(cv.pdf&&cv.pdf.data){const a=document.createElement('a');a.href=cv.pdf.data;a.download=cv.pdf.name||'CV.pdf';a.click();showToast('Downloading PDF');return}
const site=getSite();const blob=new Blob([`${site.name}\n${site.role}\n\n${cv.summary}\n\nExperience:\n${cv.experience.map(e=>`${e.period} — ${e.role} @ ${e.company}\n${e.desc}`).join('\n\n')}\n\nEducation:\n${cv.education.map(e=>`${e.period} — ${e.role} @ ${e.company}`).join('\n')}`],{type:'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=(site.cvFile||'CV.txt').replace('.pdf','.txt');a.click();URL.revokeObjectURL(url);showToast('CV downloaded (text fallback — upload PDF in admin)')}
function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}

function tabAboutHTML(){
const a=state.aboutDraft||getAbout();
return `<div class="editor-card"><h4><i class="fa-solid fa-user" style="color:var(--blue)"></i> About content</h4><div class="fgroup"><label>Photo</label><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><label class="upload-btn"><i class="fa-solid fa-upload"></i> Upload photo<input type="file" id="aboutPhotoInput" accept="image/*" style="display:none"></label><img class="cover-prev" src="${esc(a.photo)}" style="width:70px;height:70px;border-radius:50%"></div></div><div class="grid2"><div class="fgroup"><label>Name</label><input class="inp" id="aboutName" value="${esc(a.name)}"></div><div class="fgroup"><label>Location</label><input class="inp" id="aboutLoc" value="${esc(a.location)}"></div></div><div class="fgroup"><label>Bio lead</label><textarea class="inp" id="aboutBio" rows="3">${esc(a.bio)}</textarea></div><div class="fgroup"><label>Bio second paragraph</label><textarea class="inp" id="aboutBio2" rows="3">${esc(a.bio2)}</textarea></div><div class="fgroup"><label>Quote</label><input class="inp" id="aboutQuote" value="${esc(a.quote)}"></div><div class="grid2"><div class="fgroup"><label>Skills (comma separated)</label><textarea class="inp" id="aboutSkills" rows="3">${esc(a.skills.join(', '))}</textarea></div><div class="fgroup"><label>Stack (comma separated)</label><textarea class="inp" id="aboutStack" rows="3">${esc(a.stack.join(', '))}</textarea></div></div><div class="fgroup"><label>Facts (JSON: [{"n":"6+","l":"Years"}])</label><textarea class="inp" id="aboutFacts" rows="3">${esc(JSON.stringify(a.facts))}</textarea></div><div class="form-actions"><button class="btn btn-blue" data-action="save-about"><i class="fa-solid fa-floppy-disk"></i> Save about</button></div></div>`;
}
function tabCVHTML(){
const cv=state.cvDraft;
return `<div class="editor-card"><h4><i class="fa-solid fa-file-lines" style="color:var(--blue)"></i> CV summary & PDF</h4><div class="fgroup"><label>Summary</label><textarea class="inp" id="cvSummary" rows="3">${esc(cv.summary)}</textarea></div><div class="fgroup"><label>Upload PDF (optional)</label><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="upload-btn"><i class="fa-solid fa-file-pdf"></i> Upload PDF<input type="file" id="cvPdfInput" accept="application/pdf" style="display:none"></label><span style="font-size:.78rem;color:var(--muted-2)">${cv.pdf?esc(cv.pdf.name):'No PDF uploaded — text fallback will be used'}</span></div></div></div>
<div class="editor-card"><h4><i class="fa-solid fa-briefcase" style="color:var(--blue)"></i> Work experience — <button class="btn btn-dark btn-sm" data-action="add-exp" style="margin-left:8px">+ Add</button></h4>${cv.experience.map((e,i)=>`<div class="cv-row-editor"><button class="row-del" data-action="del-exp" data-idx="${i}">Delete</button><div class="row-grid"><input class="inp" data-exp="period" data-idx="${i}" value="${esc(e.period)}" placeholder="Period"><input class="inp" data-exp="role" data-idx="${i}" value="${esc(e.role)}" placeholder="Role"><input class="inp" data-exp="company" data-idx="${i}" value="${esc(e.company)}" placeholder="Company"></div><textarea class="inp" data-exp="desc" data-idx="${i}" rows="2" placeholder="Description">${esc(e.desc)}</textarea></div>`).join('')}</div>
<div class="editor-card"><h4><i class="fa-solid fa-graduation-cap" style="color:var(--blue)"></i> Education — <button class="btn btn-dark btn-sm" data-action="add-edu" style="margin-left:8px">+ Add</button></h4>${cv.education.map((e,i)=>`<div class="cv-row-editor"><button class="row-del" data-action="del-edu" data-idx="${i}">Delete</button><div class="row-grid"><input class="inp" data-edu="period" data-idx="${i}" value="${esc(e.period)}"><input class="inp" data-edu="role" data-idx="${i}" value="${esc(e.role)}"><input class="inp" data-edu="company" data-idx="${i}" value="${esc(e.company)}"></div><textarea class="inp" data-edu="desc" data-idx="${i}" rows="2">${esc(e.desc)}</textarea></div>`).join('')}</div>
<div class="editor-card"><h4><i class="fa-solid fa-chart-simple" style="color:var(--blue)"></i> Skill meters — <button class="btn btn-dark btn-sm" data-action="add-meter" style="margin-left:8px">+ Add</button></h4>${cv.meters.map((m,i)=>`<div class="cv-row-editor" style="display:flex;gap:10px;align-items:center"><input class="inp" data-meter="label" data-idx="${i}" value="${esc(m.label)}" style="flex:1"><input class="inp" data-meter="value" data-idx="${i}" type="number" min="0" max="100" value="${esc(m.value)}" style="width:90px"><button class="row-del" style="position:static" data-action="del-meter" data-idx="${i}">Delete</button></div>`).join('')}<div class="form-actions"><button class="btn btn-blue" data-action="save-cv"><i class="fa-solid fa-floppy-disk"></i> Save CV</button></div></div>`;
}
function tabInboxHTML(){
const inbox=getInbox();
return `<div class="editor-card"><h4><i class="fa-solid fa-inbox" style="color:var(--blue)"></i> Inbox — ${inbox.length} messages</h4>${inbox.length?inbox.map(m=>`<div class="inbox-item"><div class="inbox-top"><div><div class="inbox-name">${esc(m.name)}</div><div class="inbox-mail">${esc(m.email)} · ${esc(m.scope||'')}</div></div><div class="inbox-date">${esc(m.date)}</div></div><div class="inbox-msg">${esc(m.message)}</div><div class="btn-row"><button class="act-btn act-del" data-action="del-msg" data-id="${m.id}"><i class="fa-solid fa-trash"></i> Delete</button><a class="act-btn act-view" href="mailto:${esc(m.email)}"><i class="fa-solid fa-reply"></i> Reply</a></div></div>`).join(''):`<div class="empty-note"><i class="fa-solid fa-inbox"></i>No messages yet — contact form submissions appear here.</div>`}</div>`;
}
function bindAdminDashboard(){
document.querySelectorAll('[data-action="admin-tab"]').forEach(b=>b.addEventListener('click',()=>{state.adminTab=b.dataset.tab;renderAdminRoute()}));
const logout=document.querySelector('[data-action="admin-logout"]');if(logout)logout.addEventListener('click',()=>{sessionStorage.removeItem('gb_auth');state.logged=false;location.hash='#/';showToast('Logged out')});
document.addEventListener('click',adminClickHandler);
document.addEventListener('change',adminChangeHandler);
document.addEventListener('input',adminInputHandler);
const pf=document.getElementById('projectForm');if(pf)pf.addEventListener('submit',saveProject);
}
function adminClickHandler(e){
const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;
if(a==='save-site'){saveSite()}
else if(a==='save-hero'){saveHero()}
else if(a==='add-cat'){const inp=document.getElementById('newCatInput');const v=inp.value.trim();if(!v)return;const cats=getCats();if(!cats.includes(v)){cats.push(v);write(K.cats,cats);showToast('Genre added: '+v)}inp.value='';renderAdminRoute()}
else if(a==='del-cat'){const cat=t.dataset.cat;let cats=getCats();cats=cats.filter(c=>c!==cat);write(K.cats,cats);showToast('Genre removed');renderAdminRoute()}
else if(a==='add-tool'){const n=document.getElementById('newToolName').value.trim();const ic=document.getElementById('newToolIcon').value.trim()||'fa-solid fa-cube';if(!n)return;const tools=getTools();tools.push({name:n,icon:ic});write(K.tools,tools);document.getElementById('newToolName').value='';document.getElementById('newToolIcon').value='';showToast('Tool added');renderAdminRoute()}
else if(a==='del-tool'){const idx=parseInt(t.dataset.idx);let tools=getTools();tools.splice(idx,1);write(K.tools,tools);showToast('Tool removed');renderAdminRoute()}
else if(a==='edit-project'){const id=t.dataset.id;state.editingId=id;const p=getProjectsSorted().find(x=>x.id===id);if(p){state.draftCover=p.cover;state.draftGallery=[...(p.gallery||[])]}state.adminTab='projects';renderAdminRoute();window.scrollTo({top:0})}
else if(a==='del-project'){const id=t.dataset.id;if(!confirm('Delete project?'))return;let ps=getProjects();ps=ps.filter(p=>p.id!==id);write(K.projects,ps);showToast('Project deleted');if(state.editingId===id){state.editingId=null;state.draftCover=null;state.draftGallery=[]}renderAdminRoute()}
else if(a==='cancel-edit'){state.editingId=null;state.draftCover=null;state.draftGallery=[];renderAdminRoute()}
else if(a==='remove-gal'){const idx=parseInt(t.dataset.idx);state.draftGallery.splice(idx,1);renderAdminRoute()}
else if(a==='add-exp'){state.cvDraft.experience.push({period:'2024 — Present',role:'New Role',company:'Company',desc:'Description'});renderAdminRoute()}
else if(a==='del-exp'){const i=parseInt(t.dataset.idx);state.cvDraft.experience.splice(i,1);renderAdminRoute()}
else if(a==='add-edu'){state.cvDraft.education.push({period:'2024',role:'Degree',company:'University',desc:'Details'});renderAdminRoute()}
else if(a==='del-edu'){const i=parseInt(t.dataset.idx);state.cvDraft.education.splice(i,1);renderAdminRoute()}
else if(a==='add-meter'){state.cvDraft.meters.push({label:'New Skill',value:80});renderAdminRoute()}
else if(a==='del-meter'){const i=parseInt(t.dataset.idx);state.cvDraft.meters.splice(i,1);renderAdminRoute()}
else if(a==='save-about'){saveAbout()}
else if(a==='save-cv'){saveCV()}
else if(a==='del-msg'){const id=t.dataset.id;let inbox=getInbox();inbox=inbox.filter(m=>m.id!==id);write(K.inbox,inbox);showToast('Message deleted');renderAdminRoute()}
else if(a==='goto'){location.hash=t.dataset.href}
else if(a==='open-admin'){location.hash='#/admin'}
else if(a==='filter'){state.filter=t.dataset.cat;const grid=document.getElementById('projectsGrid');const bar=document.getElementById('filterBar');if(grid){const ps=getProjectsSorted();const filtered=state.filter==='All'?ps:ps.filter(p=>p.category===state.filter);grid.innerHTML=workGridHTML(filtered);observeReveals()}if(bar){bar.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===state.filter))}}
else if(a==='download-cv'){downloadCV()}
}
function adminChangeHandler(e){
if(e.target.id==='pCoverInput'){const f=e.target.files[0];if(!f)return;fileToDataURL(f).then(d=>{state.draftCover=d;renderAdminRoute();showToast('Cover ready')})}
if(e.target.id==='pGalleryInput'){const files=Array.from(e.target.files||[]);if(!files.length)return;Promise.all(files.map(fileToDataURL)).then(urls=>{state.draftGallery.push(...urls);renderAdminRoute();showToast(urls.length+' images added')})}
if(e.target.id==='aboutPhotoInput'){const f=e.target.files[0];if(!f)return;fileToDataURL(f).then(d=>{state.aboutDraft.photo=d;renderAdminRoute();showToast('Photo updated')})}
if(e.target.id==='cvPdfInput'){const f=e.target.files[0];if(!f)return;fileToDataURL(f).then(d=>{state.cvDraft.pdf={name:f.name,data:d};renderAdminRoute();showToast('PDF ready')})}
}
function adminInputHandler(e){
if(e.target.dataset.exp!==undefined){const idx=parseInt(e.target.dataset.idx);const field=e.target.dataset.exp;state.cvDraft.experience[idx][field]=e.target.value}
if(e.target.dataset.edu!==undefined){const idx=parseInt(e.target.dataset.idx);const field=e.target.dataset.edu;state.cvDraft.education[idx][field]=e.target.value}
if(e.target.dataset.meter!==undefined){const idx=parseInt(e.target.dataset.idx);const field=e.target.dataset.meter;state.cvDraft.meters[idx][field]=field==='value'?parseInt(e.target.value)||0:e.target.value}
}
function saveSite(){
const s=getSite();
s.name=document.getElementById('siteName').value.trim()||s.name;
s.initials=document.getElementById('siteInitials').value.trim()||s.initials;
s.role=document.getElementById('siteRole').value.trim();
s.tagline=document.getElementById('siteTagline').value.trim();
s.location=document.getElementById('siteLoc').value.trim();
s.availability=document.getElementById('siteAvail').value.trim();
s.email=document.getElementById('siteEmail').value.trim();
s.cvFile=document.getElementById('siteCvFile').value.trim();
s.linkedin=document.getElementById('siteLi').value.trim();
s.instagram=document.getElementById('siteIg').value.trim();
s.dribbble=document.getElementById('siteDr').value.trim();
write(K.site,s);showToast('Site saved — live now');renderAdminRoute();
}
function saveHero(){
const s=getSite();
s.heroLines=[document.getElementById('heroL1').value.trim()||'CLUB',document.getElementById('heroL2').value.trim()||'SOCIALFI',document.getElementById('heroL3').value.trim()||'PEOPLE'];
s.heroHash=document.getElementById('heroHash').checked;
s.ctaTitle=document.getElementById('ctaTitle').value.trim();
s.ctaSerif=document.getElementById('ctaSerif').value.trim();
s.ctaBtn=document.getElementById('ctaBtn').value.trim();
write(K.site,s);showToast('Hero & CTA saved');renderAdminRoute();
}
function saveProject(e){
e.preventDefault();
const title=document.getElementById('pTitle').value.trim();if(!title){showToast('Title required');return}
const cat=document.getElementById('pCat').value;
const client=document.getElementById('pClient').value.trim();
const year=document.getElementById('pYear').value.trim();
const order=parseInt(document.getElementById('pOrder').value)||0;
const desc=document.getElementById('pDesc').value.trim();
const overview=document.getElementById('pOverview').value.trim();
const role=document.getElementById('pRole').value.trim();
const tools=document.getElementById('pTools').value.trim();
const link=document.getElementById('pLink').value.trim();
const feat=document.getElementById('pFeat').checked;
const cover=state.draftCover|| (state.editingId? (getProjects().find(p=>p.id===state.editingId)?.cover) : '') || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80';
const gallery=state.draftGallery.length?state.draftGallery:(state.editingId? (getProjects().find(p=>p.id===state.editingId)?.gallery||[cover]) : [cover]);
let projects=getProjects();
const obj={id:state.editingId||'proj-'+Date.now(),order,title,category:cat,client,year,desc,overview,role,tools,link,featured:feat,cover,gallery};
if(state.editingId){projects=projects.map(p=>p.id===state.editingId?obj:p)}else{projects.push(obj)}
write(K.projects,projects);showToast(state.editingId?'Project updated':'Project created');state.editingId=null;state.draftCover=null;state.draftGallery=[];renderAdminRoute();
}
function saveAbout(){
const a=state.aboutDraft;
a.name=document.getElementById('aboutName').value.trim();
a.location=document.getElementById('aboutLoc').value.trim();
a.bio=document.getElementById('aboutBio').value.trim();
a.bio2=document.getElementById('aboutBio2').value.trim();
a.quote=document.getElementById('aboutQuote').value.trim();
a.skills=document.getElementById('aboutSkills').value.split(',').map(s=>s.trim()).filter(Boolean);
a.stack=document.getElementById('aboutStack').value.split(',').map(s=>s.trim()).filter(Boolean);
try{const f=JSON.parse(document.getElementById('aboutFacts').value);if(Array.isArray(f))a.facts=f}catch(e){showToast('Facts JSON invalid — keeping old');}
write(K.about,a);showToast('About saved');state.aboutDraft=JSON.parse(JSON.stringify(a));renderAdminRoute();
}
function saveCV(){
const cv=state.cvDraft;
cv.summary=document.getElementById('cvSummary').value.trim();
write(K.cv,cv);showToast('CV saved');renderAdminRoute();
}
/* GLOBAL LISTENERS */
document.addEventListener('click',(e)=>{
const t=e.target.closest('[data-action]');if(!t)return;
const act=t.dataset.action;
if(act==='filter'){state.filter=t.dataset.cat;const grid=document.getElementById('projectsGrid');const bar=document.getElementById('filterBar');if(grid){const ps=getProjectsSorted();const filtered=state.filter==='All'?ps:ps.filter(p=>p.category===state.filter);grid.innerHTML=workGridHTML(filtered);observeReveals()}if(bar){bar.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.cat===state.filter))}}
else if(act==='goto'){location.hash=t.dataset.href}
else if(act==='open-admin'){location.hash='#/admin'}
else if(act==='download-cv'){downloadCV()}
});
document.getElementById('burgerBtn').addEventListener('click',()=>document.body.classList.toggle('menu-open'));
document.getElementById('mobileMenu').addEventListener('click',(e)=>{if(e.target.closest('a'))document.body.classList.remove('menu-open')});
window.addEventListener('scroll',()=>{const bar=document.getElementById('progressBar');if(!bar)return;const h=document.documentElement;const sc=(h.scrollTop/(h.scrollHeight-h.clientHeight))*100;bar.style.width=sc+'%';const nav=document.getElementById('nav');if(nav){if(window.scrollY>20)nav.classList.add('scrolled');else nav.classList.remove('scrolled')}});
window.addEventListener('hashchange',render);
window.addEventListener('DOMContentLoaded',()=>{if(!read(K.projects,null))write(K.projects,D_PROJECTS);if(!read(K.cats,null))write(K.cats,D_CATS);if(!read(K.tools,null))write(K.tools,D_TOOLS);if(!read(K.about,null))write(K.about,D_ABOUT);if(!read(K.cv,null))write(K.cv,D_CV);if(!read(K.inbox,null))write(K.inbox,D_INBOX);if(!read(K.site,null))write(K.site,D_SITE);render()});
document.addEventListener('click',(e)=>{if(e.target.closest('.mobile-menu a'))document.body.classList.remove('menu-open')});
</script>
</body>
</html>
